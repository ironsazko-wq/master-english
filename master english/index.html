<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physique 2BAC — Révision Complète</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c12;
  --surface: #13161f;
  --card: #1a1e2a;
  --border: #252b3b;
  --c1: #00d4ff;   /* ondes meca */
  --c2: #a78bfa;   /* nucleaire */
  --c3: #f59e0b;   /* ondes lum */
  --c4: #34d399;   /* oscillateurs */
  --c5: #f87171;   /* dosage */
  --text: #e2e8f4;
  --dim: #64748b;
  --correct: #34d399;
  --wrong: #f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;flex-direction:column;gap:1rem;position:sticky;top:0;z-index:100}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
.logo span{color:var(--c1)}
.chapter-tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.ch-tab{padding:.4rem .9rem;border-radius:2rem;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:'Syne',sans-serif;font-weight:600;font-size:.72rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.ch-tab:hover{color:var(--text);border-color:var(--dim)}
.ch-tab.active{color:#0a0c12}
.ch-tab[data-ch="1"].active{background:var(--c1);border-color:var(--c1)}
.ch-tab[data-ch="2"].active{background:var(--c2);border-color:var(--c2)}
.ch-tab[data-ch="3"].active{background:var(--c3);border-color:var(--c3)}
.ch-tab[data-ch="4"].active{background:var(--c4);border-color:var(--c4)}
.ch-tab[data-ch="5"].active{background:var(--c5);border-color:var(--c5)}
.mode-tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.m-tab{padding:.35rem .8rem;border-radius:.4rem;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:'Syne',sans-serif;font-weight:600;font-size:.7rem;cursor:pointer;transition:all .2s}
.m-tab:hover{color:var(--text)}
.m-tab.active{background:var(--border);color:var(--text)}

/* MAIN */
main{max-width:960px;margin:0 auto;padding:1.5rem}

/* SECTIONS */
.mode-section{display:none}
.mode-section.visible{display:block}

/* FLASHCARDS */
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.8rem;margin-top:.8rem}
.fc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.2rem;cursor:pointer;transition:transform .15s;min-height:110px;position:relative}
.fc:hover{transform:translateY(-2px)}
.fc-q{font-family:'Syne',sans-serif;font-weight:600;font-size:.88rem;line-height:1.45}
.fc-a{display:none;margin-top:.8rem;padding-top:.8rem;border-top:1px solid var(--border);font-size:.78rem;line-height:1.6;color:var(--dim)}
.fc.open .fc-a{display:block}
.fc-hint{position:absolute;bottom:.6rem;right:.8rem;font-size:.62rem;color:var(--dim);opacity:.5}
.fc-tag{display:inline-block;font-size:.6rem;font-weight:700;padding:.1rem .4rem;border-radius:3px;margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.08em}

/* QUIZ */
.quiz-wrap{max-width:680px;margin:0 auto}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;padding-bottom:.8rem;border-bottom:1px solid var(--border);font-size:.78rem}
.q-score{font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem}
.q-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:.8rem}
.q-label{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.7rem}
.q-text{font-family:'Syne',sans-serif;font-weight:600;font-size:.95rem;line-height:1.5}
.q-opts{display:grid;gap:.5rem;margin-bottom:.8rem}
.q-opt{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.8rem 1rem;font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--text);cursor:pointer;transition:all .15s;text-align:left}
.q-opt:hover:not(:disabled){border-color:var(--c3);color:var(--c3)}
.q-opt.correct{background:rgba(52,211,153,.12);border-color:var(--correct);color:var(--correct)}
.q-opt.wrong{background:rgba(248,113,113,.12);border-color:var(--wrong);color:var(--wrong)}
.q-opt:disabled{cursor:default}
.q-fb{background:var(--card);border-radius:8px;padding:.9rem 1rem;font-size:.78rem;line-height:1.6;display:none;margin-bottom:.8rem}
.q-fb.show{display:block}
.q-fb.c{border-left:3px solid var(--correct);color:var(--correct)}
.q-fb.w{border-left:3px solid var(--wrong);color:var(--dim)}
.btn-next{display:inline-block;padding:.6rem 1.3rem;border-radius:7px;border:none;font-family:'Syne',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;transition:all .2s;background:var(--c3);color:#0a0c12}
.btn-next:hover{opacity:.85;transform:translateY(-1px)}
.btn-restart{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.6rem 1.3rem;border-radius:7px;font-family:'Syne',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;margin-top:.8rem}
.result{text-align:center;padding:3rem 1rem}
.r-score{font-family:'Syne',sans-serif;font-size:3.2rem;font-weight:800;margin-bottom:.4rem}
.r-msg{color:var(--dim);font-size:.85rem;margin-bottom:1.5rem}

/* OPEN */
.open-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.3rem;margin-bottom:1.2rem}
.open-block h3{font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.oq{margin-bottom:1.1rem}
.oq p{font-size:.8rem;line-height:1.5;margin-bottom:.4rem}
.oq textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:.7rem;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.78rem;resize:vertical;min-height:75px;transition:border-color .2s}
.oq textarea:focus{outline:none;border-color:var(--c3)}
.rev-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:.35rem .8rem;color:var(--dim);font-family:'Syne',sans-serif;font-size:.7rem;font-weight:600;cursor:pointer;margin-top:.3rem;transition:all .2s}
.rev-btn:hover{border-color:var(--c4);color:var(--c4)}
.oa{display:none;margin-top:.5rem;padding:.7rem;background:rgba(52,211,153,.07);border-left:2px solid var(--c4);border-radius:4px;font-size:.76rem;line-height:1.6;color:var(--c4)}
.oa.vis{display:block}

/* SUMMARY */
.sum-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.4rem;margin-bottom:1.2rem}
.sum-block h2{font-family:'Syne',sans-serif;font-size:.9rem;font-weight:800;margin-bottom:.9rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.sum-block ul{list-style:none;padding:0}
.formula-sheet{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:1rem;margin-top:1rem}
.formula-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;min-height:220px}
.formula-card h3{font-family:'Syne',sans-serif;font-size:.88rem;font-weight:800;margin-bottom:.85rem;color:var(--text)}
.formula-card ul{list-style:none;padding:0;display:grid;gap:.6rem}
.formula-card ul li{background:rgba(255,255,255,.03);padding:.65rem .75rem;border-radius:8px;font-size:.78rem;line-height:1.45;color:var(--text);border:1px solid rgba(255,255,255,.06)}
@media(max-width:720px){.formula-sheet{grid-template-columns:1fr}}
@page{
  size:A4;
  margin:6mm;
}
@media print{
body{background:#000;color:#000000}
  nav, .m-tab, .ch-tab, .btn-next{display:none}

  /* Fit content into A4 (fix: reduce zoom/force layout) */
  html,body{
    width:210mm;
    min-height:297mm;
  }
  main{
    transform:scale(0.78);
    transform-origin:top left;
    width:128%;
  }
  *{box-sizing:border-box;}
  body{font-family:Arial, sans-serif;}

  main{display:grid;grid-template-columns:1fr 1fr;gap:6px}

  .formula{border:1px solid #000000;padding:4px;font-size:9px;line-height:1.1;break-inside:avoid;background:#181818}

  h1,h2,h3,p{margin:2px 0}


  /* Force the formulas sheet to fit on one page */
  .formula-sheet{grid-template-columns:1fr;gap:.35rem;margin-top:.2rem}
  .formula-card{padding:.7rem;min-height:auto}
  .formula-card h3{font-size:.78rem;margin-bottom:.45rem}
  .formula-card ul{gap:.25rem}
  .formula-card ul li{font-size:.62rem;line-height:1.35;padding:.22rem .35rem;background:#000000;border-color:#000000;color:#000000}

  /* Avoid big blank spaces */
  main{padding:0}
}

.sum-block ul li{font-size:.78rem;line-height:1.65;padding:.25rem 0 .25rem 1.1rem;position:relative;color:var(--dim)}
.sum-block ul li::before{content:'→';position:absolute;left:0}
.formula{background:var(--surface);border-radius:6px;padding:.6rem .9rem;font-size:.78rem;margin:.4rem 0;line-height:1.6;border-left:2px solid var(--border)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.5rem}
.sub-label{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:.4rem}
.sec-title{font-family:'Syne',sans-serif;font-size:.65rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin:1.5rem 0 .5rem}

@media(max-width:480px){
  .two-col{grid-template-columns:1fr}
  nav{padding:.8rem 1rem}
  main{padding:1rem}
}
</style>
</head>
<body>

<nav>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div class="logo">Physique <span>2BAC</span></div>
    <div style="font-size:.65rem;color:var(--dim)" id="q-counter-nav"></div>
  </div>
  <div class="chapter-tabs">
    <button class="ch-tab active" data-ch="1" onclick="setChapter(1)">🌊 Ondes méca</button>
    <button class="ch-tab" data-ch="2" onclick="setChapter(2)">☢️ Nucléaire</button>
    <button class="ch-tab" data-ch="3" onclick="setChapter(3)">💡 Ondes lum</button>
    <button class="ch-tab" data-ch="4" onclick="setChapter(4)">🔄 Oscillateurs</button>
    <button class="ch-tab" data-ch="5" onclick="setChapter(5)">🧪 Dosage</button>
  </div>
  <div class="mode-tabs">
    <button class="m-tab active" data-mode="fc" onclick="setMode('fc', event)">📇 Flashcards</button>
    <button class="m-tab" data-mode="sum" onclick="setMode('sum', event)">📋 Résumé</button>
    <button class="m-tab" data-mode="form" onclick="setMode('form', event)">📘 Formules</button>
    <button class="m-tab" data-mode="quiz" onclick="setMode('quiz', event)">🎯 Quiz</button>
    <button class="m-tab" data-mode="exo" onclick="setMode('exo', event)">📝 Exercices</button>
    <button class="m-tab" data-mode="open" onclick="setMode('open', event)">✏️ Ouvertes</button>
  </div>
</nav>

<main>
  <div id="sec-fc" class="mode-section visible">
    <p style="color:var(--dim);font-size:.75rem;margin-bottom:.8rem">Clique pour voir la réponse</p>
    <div class="fc-grid" id="fc-container"></div>
  </div>

  <div id="sec-sum" class="mode-section">
    <div id="sum-container"></div>
  </div>

  <div id="sec-quiz" class="mode-section">
    <div class="quiz-wrap">
      <div class="q-meta">
        <span id="qprog" style="color:var(--dim)">—</span>
        <span class="q-score" id="qscore">Score : 0</span>
      </div>
      <div id="qcontent"></div>
    </div>
  </div>

  <div id="sec-exo" class="mode-section">
    <div id="exo-container"></div>
  </div>

  <div id="sec-form" class="mode-section">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem">
      <h2 style="font-family:'Syne',sans-serif;color:var(--text);margin:0">Feuille de formules</h2>
      <button class="btn-next" style="background:var(--c1);color:#0a0c12" onclick="window.print()">Télécharger / Imprimer</button>
    </div>
    <div id="form-container"></div>
  </div>

  <div id="sec-open" class="mode-section">
    <div id="open-container"></div>
  </div>
</main>

<script>
// ============================================================
// DATA
// ============================================================
const DATA = {
  1: {
    name: "Ondes mécaniques",
    color: "var(--c1)",
    flashcards: [
      {q:"Définition d'une onde mécanique ?",a:"Perturbation se propageant dans un milieu matériel sans transport de matière, seulement d'énergie."},
      {q:"Différence onde transversale vs longitudinale ?",a:"Transversale : vibration ⊥ propagation (corde, eau). Longitudinale : vibration ∥ propagation (son, ressort)."},
      {q:"Formules de vitesse de propagation ?",a:"V = d/Δt = λ/T = λ·f = λ·N. Retard : τ = Δt = d/V = λ/V"},
      {q:"Vitesse du son selon le milieu ?",a:"Vsolide > Vliquide > Vgaz. Sons audibles : 20 Hz < f < 20 kHz. Ultrasons : f > 20 kHz"},
      {q:"Condition de diffraction d'une onde ?",a:"Si a < λ → diffraction (onde se courbe autour de l'obstacle). Si a > λ → pas de diffraction."},
      {q:"Points en phase vs opposition de phase ?",a:"En phase : AB = k·λ (k ∈ ℕ). Opposition de phase : AB = (2k+1)·λ/2"},
      {q:"Qu'est-ce qu'un milieu dispersif ?",a:"Milieu où la vitesse dépend de la fréquence : V₁ ≠ V₂. Exemples : eau, verre."},
      {q:"Vitesse sur une corde ?",a:"V = √(F/μ) où F = tension de la corde (N) et μ = m/L = masse linéique (kg/m)"},
      {q:"Vitesse à la surface de l'eau ?",a:"V = √(g·h) où g = 9,8 m/s² et h = profondeur de l'eau (m)"},
      {q:"Elongation d'un point S et N ?",a:"yS(t) = yN(t + τ) et yN(t) = yS(t − τ) où τ = retard temporel"},
      {q:"Définition de la longueur d'onde λ ?",a:"Distance entre deux points en phase consécutifs = distance parcourue pendant une période T. λ = V × T"},
      {q:"Définition de la fréquence f et la période T ?",a:"T = durée d'un cycle (s). f = 1/T (Hz). T = 1/f"},
    ],
    summary: `
<div class="sum-block"><h2 style="color:var(--c1)">🌊 Ondes mécaniques progressives</h2>
<ul>
<li>Onde mécanique = perturbation se propageant dans un milieu matériel</li>
<li>Transversale : vibration ⊥ propagation → corde, surface d'eau</li>
<li>Longitudinale : vibration ∥ propagation → son, ressort</li>
<li>Vsolide > Vliquide > Vgaz</li>
</ul>
<div class="formula" style="border-left-color:var(--c1)">V = d/Δt = λ/T = λ·f &nbsp;|&nbsp; τ = d/V = λ/V</div>
<div class="formula" style="border-left-color:var(--c1)">V corde = √(F/μ) &nbsp;|&nbsp; V eau = √(g·h)</div>
</div>
<div class="sum-block"><h2 style="color:var(--c1)">🌊 Ondes périodiques — points en phase</h2>
<ul>
<li>En phase : AB = k·λ (k ∈ ℕ)</li>
<li>Opposition de phase : AB = (2k+1)·λ/2</li>
<li>Milieu dispersif : vitesse dépend de f → V₁ ≠ V₂</li>
<li>Diffraction : si a &lt; λ → l'onde se courbe. Si a &gt; λ → pas de diffraction</li>
</ul>
<div class="formula" style="border-left-color:var(--c1)">yS(t) = yN(t + τ) &nbsp;|&nbsp; yN(t) = yS(t − τ)</div>
</div>`,
    quiz: [
      {q:"Définition d'une onde mécanique ?",opts:["Transport de matière dans un milieu","Perturbation se propageant dans un milieu matériel sans transport de matière","Déplacement d'électrons","Vibration du vide"],ans:1,exp:"Une onde mécanique = perturbation qui se propage dans un milieu matériel en transportant de l'énergie SANS transport de matière."},
      {q:"Onde transversale : la vibration est :",opts:["Parallèle à la propagation","Perpendiculaire à la propagation","Dans toutes les directions","Nulle"],ans:1,exp:"Transversale : vibration ⊥ propagation. Exemples : corde, surface d'eau. Longitudinale : vibration ∥ propagation (son, ressort)."},
      {q:"La vitesse de propagation V d'une onde sur une corde dépend de :",opts:["La fréquence f","La tension F et la masse linéique μ","L'amplitude Xₘ","La longueur d'onde λ"],ans:1,exp:"V = √(F/μ). Elle ne dépend pas de f ni de l'amplitude. La corde est un milieu non dispersif."},
      {q:"L'ordre de vitesse selon le milieu est :",opts:["Vgaz > Vliquide > Vsolide","Vliquide > Vsolide > Vgaz","Vsolide > Vliquide > Vgaz","Tous identiques"],ans:2,exp:"Vsolide > Vliquide > Vgaz. Le son va plus vite dans les solides que dans les liquides, et plus vite dans les liquides que dans les gaz."},
      {q:"Les ultrasons ont une fréquence :",opts:["20 Hz < f < 20 kHz","f < 20 Hz","f > 20 kHz","f = 0 Hz"],ans:2,exp:"Sons audibles : 20 Hz < f < 20 kHz. Ultrasons : f > 20 kHz (non audibles par l'homme). Infrasons : f < 20 Hz."},
      {q:"La diffraction se produit quand :",opts:["a > λ","a >> λ","a < λ","a = 100λ"],ans:2,exp:"Condition de diffraction : a < λ (ou b < a < 100λ pour la lumière). Si a > λ, pas de diffraction."},
      {q:"Deux points A et B sont en phase si AB = ?",opts:["(2k+1)·λ/2","k·λ (k ∈ ℕ)","λ/4","3λ/4"],ans:1,exp:"En phase : AB = k·λ. Opposition de phase : AB = (2k+1)·λ/2."},
      {q:"Deux points sont en opposition de phase si AB = ?",opts:["k·λ","λ/2 seulement","(2k+1)·λ/2","2k·λ"],ans:2,exp:"Opposition de phase : AB = (2k+1)·λ/2. Exemple : AB = λ/2, 3λ/2, 5λ/2..."},
      {q:"Un milieu dispersif est un milieu où :",opts:["La vitesse est nulle","La vitesse dépend de la fréquence (V₁ ≠ V₂)","L'onde ne se propage pas","L'amplitude diminue"],ans:1,exp:"Dans un milieu dispersif, la vitesse varie avec la fréquence. Exemples : eau, verre. Conséquence : dispersion des couleurs."},
      {q:"La vitesse à la surface de l'eau de profondeur h est :",opts:["V = √(F/μ)","V = λ·f","V = √(g·h)","V = c/n"],ans:2,exp:"V = √(g·h) où g = 9.8 m/s² et h = profondeur. Plus l'eau est profonde, plus l'onde va vite."},
      {q:"L'élongation du point S en fonction du point N (en avance) est :",opts:["yS(t) = yN(t − τ)","yS(t) = yN(t + τ)","yS(t) = yN(t) × τ","yS(t) = yN(τ − t)"],ans:1,exp:"S est la source, elle est en avance sur N : yS(t) = yN(t + τ). Inversement : yN(t) = yS(t − τ)."},
      {q:"La longueur d'onde λ est :",opts:["La période temporelle","La distance entre 2 points en phase consécutifs = V × T","La fréquence en mètres","L'amplitude maximale"],ans:1,exp:"λ = V × T = V/f. C'est la distance parcourue par l'onde pendant une période T."},
      {q:"La formule du retard temporel τ est :",opts:["τ = V·d","τ = d/V = λ/V","τ = f/d","τ = V/λ"],ans:1,exp:"τ = Δt = d/V = λ/V. C'est le temps mis par l'onde pour parcourir la distance d entre deux points."},
      {q:"Fréquence f et période T sont liées par :",opts:["f = T","f = 1/T","f = T²","f = 2πT"],ans:1,exp:"f = 1/T (en Hz). T = 1/f (en s). La période T est la durée d'un cycle complet."},
    ],
    open: [
      {q:"Explique la différence entre une onde transversale et longitudinale avec des exemples.",a:"Onde transversale : la vibration est perpendiculaire à la direction de propagation. Exemples : corde vibrante, vague à la surface de l'eau. Onde longitudinale : la vibration est parallèle à la direction de propagation. Exemples : son dans l'air, onde dans un ressort."},
      {q:"Un émetteur S envoie une onde de fréquence 500 Hz dans l'eau (h = 10 m). Calcule V, λ et le retard τ pour un point M à 2 m de S.",a:"V = √(g·h) = √(9.8×10) ≈ 9.9 m/s. λ = V/f = 9.9/500 ≈ 0.02 m = 2 cm. τ = d/V = 2/9.9 ≈ 0.2 s."},
      {q:"Deux points A et B sont séparés de 3λ. Sont-ils en phase ou en opposition ? Justifie.",a:"AB = 3λ = 3·λ → k = 3 ∈ ℕ → en phase (AB = k·λ). Si AB = 3λ/2 = 1.5λ → (2k+1)λ/2 avec k=1 → opposition de phase."},
    ],
    exercises: [
      {title:"Exercice national ondes progressives", q:"Un émetteur S envoie une onde sinusoïdale de fréquence 500 Hz à la surface de l'eau profonde de 4,0 m. a) Calculez la vitesse de propagation V, la longueur d'onde λ et le retard τ entre S et un point M situé à 2,00 m de S. b) Si A et B sont séparés de 1,00 m, sont-ils en phase ou en opposition si λ = 0,0125 m ?", a:"V = √(g·h) = √(9.8×4,0) ≈ 6,26 m/s. λ = V/f ≈ 6,26/500 ≈ 0,0125 m. τ = d/V = 2,00/6,26 ≈ 0,32 s. Pour A et B : 1,00 m = 80 λ, donc AB = k·λ avec k entier, ils sont en phase."},

      {q:"Dans un dosage à l'équivalence, la concentration en H₃O⁺ libre s'exprime :",opts:["10^{pH−14}","10^{−pH}","10^{14−pH}","10^{pH}"],ans:1,exp:"La concentration en H₃O⁺ est toujours [H₃O⁺] = 10^{-pH}. C'est la base de l'échelle de pH."},
    ],
    open: [
      {q:"On dose Vₐ = 10 mL d'acide de concentration Cₐ = 0.1 mol/L par une base C_B = 0.2 mol/L. Calcule V_E et confirme par la relation d'équivalence.",a:"Relation : CₐVₐ = C_BV_E → V_E = CₐVₐ/C_B = (0.1×10)/(0.2) = 1/0.2 = 5 mL. Vérification : n(HA) = 0.1×10×10⁻³ = 10⁻³ mol. n(HO⁻) = 0.2×5×10⁻³ = 10⁻³ mol. Égaux → τ = 1 ✓"},
      {q:"Explique comment repérer le point équivalent E sur la courbe pH = f(V) et comment en déduire les concentrations.",a:"Le point E est le point d'inflexion de la courbe pH = f(V), au milieu du saut de pH. Méthode : tracer deux tangentes parallèles encadrant la courbe, puis une droite parallèle passant entre elles → intersection avec la courbe = point E. On lit V_E sur l'axe des abscisses, puis : Cₐ = C_B·V_E/Vₐ (ou C_B = Cₐ·V_E/V_B)."},

      {title:"Exercice national demi-équivalence", q:"Un acide faible a pKa = 4,50. Quel est le pH à la demi-équivalence lors d'un dosage par une base forte ?", a:"À la demi-équivalence, [HA] = [A⁻] et pH = pKa. Donc pH = 4,50."},
      {title:"Exercice national pH à l'équivalence", q:"Dans un dosage acide fort/base forte, le pH à l'équivalence est 7. Dans un dosage d'un acide faible par une base forte, le pH à l'équivalence est 8. a) Quelle est [HO⁻] à l'équivalence pour pH = 8 ? b) Quelle est [H₃O⁺] correspondante ?", a:"[HO⁻] = 10^{pH-14} = 10^{8-14} = 10^{-6} mol/L. [H₃O⁺] = 10^{-pH} = 10^{-8} mol/L. À l'équivalence d'un acide faible par une base forte, la solution est basique car l'ion A⁻ hydrolyse l'eau."},
    ],
  },
};

for (const ch in FORMULAS) {
  if (DATA[ch] && Array.isArray(DATA[ch].flashcards)) {
    // Prepend formulas so they appear first in flashcards view
    DATA[ch].flashcards = FORMULAS[ch].concat(DATA[ch].flashcards);
  }
}

// ============================================================
// STATE
// ============================================================
let curChapter = 1;
let curMode = 'fc';
let quizState = {current:0, score:0, answered:false};

// ============================================================
// RENDER HELPERS
// ============================================================
function colorOf(ch){ return DATA[ch].color; }

function renderFlashcards() {
  const container = document.getElementById('fc-container');
  container.innerHTML = '';
  const cards = DATA[curChapter].flashcards;
  const col = colorOf(curChapter);
  cards.forEach(card => {
    const div = document.createElement('div');
    div.className = 'fc';
    div.style.borderLeftColor = col;
    div.style.borderLeftWidth = '3px';
    div.innerHTML = `<div class="fc-q">${card.q}</div><div class="fc-a">${card.a}</div><span class="fc-hint">cliquer</span>`;
    div.onclick = () => {
      div.classList.toggle('open');
      div.querySelector('.fc-hint').style.display = div.classList.contains('open') ? 'none' : 'block';
      if (div.classList.contains('open')) div.querySelector('.fc-a').style.color = col;
    };
    container.appendChild(div);
  });
}

function renderSummary() {
  document.getElementById('sum-container').innerHTML = DATA[curChapter].summary;
}

function renderOpenQuestions() {
  const container = document.getElementById('open-container');
  const col = colorOf(curChapter);
  container.innerHTML = `<div class="open-block" style="border-color:${col}40">
  <h3 style="color:${col}">${DATA[curChapter].name} — Questions ouvertes</h3>
  ${DATA[curChapter].open.map((item, i) => `
  <div class="oq">
    <p>${i+1}. ${item.q}</p>
    <textarea placeholder="Ta réponse ici..."></textarea>
    <button class="rev-btn" onclick="revealAnswer(this)">Voir la correction</button>
    <div class="oa">${item.a}</div>
  </div>`).join('')}
  </div>`;
}

function renderFormulas() {
  const container = document.getElementById('form-container');
  container.innerHTML = `<div class="formula-sheet">${Object.entries(FORMULAS).map(([ch, formulas]) => {
    const chapterName = DATA[ch] ? DATA[ch].name : `Chapitre ${ch}`;
    return `<div class="formula-card"><h3>${chapterName}</h3><ul>${formulas.map(f => `
      <li><strong>${f.q}</strong><br>${f.a}</li>`).join('')}</ul></div>`;
  }).join('')}</div>`;
}

function renderExercises() {
  const container = document.getElementById('exo-container');
  const col = colorOf(curChapter);
  container.innerHTML = `<div class="open-block" style="border-color:${col}40">
  <h3 style="color:${col}">${DATA[curChapter].name} — Exercices nationaux</h3>
  ${DATA[curChapter].exercises.map((item, i) => `
  <div class="oq">
    <p><strong>${i+1}. ${item.title}</strong></p>
    <p>${item.q}</p>
    <button class="rev-btn" onclick="revealAnswer(this)">Voir la correction</button>
    <div class="oa">${item.a}</div>
  </div>`).join('')}
  </div>`;
}

function revealAnswer(btn) {
  const ans = btn.nextElementSibling;
  ans.classList.toggle('vis');
  btn.textContent = ans.classList.contains('vis') ? 'Masquer' : 'Voir la correction';
}

// ============================================================
// QUIZ
// ============================================================
function initQuiz() {
  quizState = {current:0, score:0, answered:false};
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const qArr = DATA[curChapter].quiz;
  const qprog = document.getElementById('qprog');
  const qscore = document.getElementById('qscore');

  if (quizState.current >= qArr.length) {
    const pct = Math.round(quizState.score/qArr.length*100);
    const col = pct>=80?'var(--correct)':pct>=60?'var(--c3)':'var(--wrong)';
    document.getElementById('qcontent').innerHTML = `
    <div class="result">
      <div class="r-score" style="color:${col}">${quizState.score}/${qArr.length}</div>
      <div class="r-msg">${pct}% · ${pct>=80?'🔥 Excellent !':pct>=60?'👍 Bien !':'💪 Continue !'}</div>
      <button class="btn-restart" onclick="initQuiz()">🔄 Recommencer</button>
    </div>`;
    qprog.textContent = 'Terminé !';
    return;
  }

  const q = qArr[quizState.current];
  const col = colorOf(curChapter);
  qprog.textContent = `Question ${quizState.current+1} / ${qArr.length}`;
  qscore.textContent = `Score : ${quizState.score}`;
  qscore.style.color = col;

  document.getElementById('qcontent').innerHTML = `
  <div class="q-box">
    <div class="q-label" style="color:${col}">Question ${quizState.current+1} — ${DATA[curChapter].name}</div>
    <div class="q-text">${q.q}</div>
  </div>
  <div class="q-opts">
    ${q.opts.map((opt,i)=>`<button class="q-opt" onclick="selectAns(${i})">${opt}</button>`).join('')}
  </div>
  <div class="q-fb" id="qfb"></div>
  <button class="btn-next" id="btn-nx" style="display:none;background:${col}" onclick="nextQ()">Suivant →</button>`;
  quizState.answered = false;
}

function selectAns(idx) {
  if (quizState.answered) return;
  quizState.answered = true;
  const q = DATA[curChapter].quiz[quizState.current];
  const opts = document.querySelectorAll('.q-opt');
  const fb = document.getElementById('qfb');
  opts.forEach(o=>o.disabled=true);
  opts[q.ans].classList.add('correct');
  if (idx === q.ans) {
    quizState.score++;
    fb.className='q-fb c show';
    fb.textContent='✓ Correct ! '+q.exp;
  } else {
    opts[idx].classList.add('wrong');
    fb.className='q-fb w show';
    fb.textContent='✗ '+q.exp;
  }
  document.getElementById('btn-nx').style.display='inline-block';
  document.getElementById('qscore').textContent=`Score : ${quizState.score}`;
}

function nextQ() {
  quizState.current++;
  renderQuizQuestion();
}

// ============================================================
// NAVIGATION
// ============================================================
function setChapter(ch) {
  curChapter = ch;
  document.querySelectorAll('.ch-tab').forEach(t=>{
    t.classList.remove('active');
    if (parseInt(t.dataset.ch)===ch) t.classList.add('active');
  });
  refreshMode();
}

function setMode(mode, event) {
  curMode = mode;
  document.querySelectorAll('.m-tab').forEach(t=>t.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  else {
    const tab = document.querySelector(`.m-tab[data-mode="${mode}"]`);
    if (tab) tab.classList.add('active');
  }
  refreshMode();
}

function refreshMode() {
  ['fc','sum','form','quiz','exo','open'].forEach(m=>{
    document.getElementById(`sec-${m}`).classList.remove('visible');
  });
  document.getElementById(`sec-${curMode}`).classList.add('visible');
  if (curMode==='fc') renderFlashcards();
  else if (curMode==='sum') renderSummary();
  else if (curMode==='form') renderFormulas();
  else if (curMode==='quiz') initQuiz();
  else if (curMode==='exo') renderExercises();
  else if (curMode==='open') renderOpenQuestions();
}

// INIT
renderFlashcards();
</script>
